<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::title}, ~{::main})">
<title>Gerenciar Serviços - Admin</title>
<main>
    <section>
        <h2>Serviços</h2>
        <table>
            <thead><tr><th>Nome</th><th>Categoria</th><th>Preço</th></tr></thead>
            <tbody>
            <tr th:each="s : ${services}">
                <td th:text="${s.name}"></td>
                <td th:text="${s.category}"></td>
                <td>R$ <span th:text="${s.price}"></span></td>
            </tr>
            </tbody>
        </table>

        <h3>Adicionar Serviço</h3>
        <form method="post" action="/admin/services/add">
            <label>Nome</label>
            <input name="name" />
            <label>Descrição</label>
            <textarea name="description"></textarea>
            <label>Categoria</label>
            <input name="category" />
            <label>Preço</label>
            <input name="price" type="number" step="0.01" />
            <button class="btn" type="submit">Salvar</button>
        </form>
    </section>
</main>
</html>
